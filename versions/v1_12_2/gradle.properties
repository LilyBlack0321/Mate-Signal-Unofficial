# Gradle configuration for MateSignal 1.12.2 Forge port.
#
# This port follows the official Forge 1.12.2 MDK toolchain:
#   Gradle 4.10.3 + JDK 8 + ForgeGradle 3.x
# ForgeGradle 3 cannot run on modern Gradle/Java, so build-all.ps1 points
# JAVA_HOME at the bundled Temurin 8 JDK for this project only.

org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
# Not configurable on Gradle 4.x (the option arrived in Gradle 6.5); the legacy
# ForgeGradle 3 toolchain does not use the native watcher.

mod_id=matesignal
mod_name=MateSignal Unofficial
mod_version=1.1.0
mod_group_id=me.shiny.matesignal
mod_authors=Shiny
