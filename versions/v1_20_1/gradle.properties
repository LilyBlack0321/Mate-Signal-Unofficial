# Gradle configuration for the MateSignal 1.20.1 Forge port.
#
# Machine-specific settings (an HTTP proxy, a disabled ForgeGradle certificate
# probe) do not belong in a public repository. Put them in an untracked
# `gradle.properties.local` next to this file; tools/build-all.ps1 reads the
# `systemProp.*` entries from it and passes them to the Gradle JVM. See
# gradle.properties.local.example at the repository root.

org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=false
# Gradle's native file-watcher fails on some Windows environments (and in
# restricted sandboxes) with "Couldn't open current thread, error = 5", which
# aborts the build. Polling is slower but always works, and a mod this size does
# not notice the difference.
org.gradle.vfs.watch=false
org.gradle.continuous.quietperiod=2

