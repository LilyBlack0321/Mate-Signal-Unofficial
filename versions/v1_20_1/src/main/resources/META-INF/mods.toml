modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MateEngine Pro License v2.0"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="pack.png"
description='''${mod_description}'''
authors="${mod_authors}"
credits="${mod_credits}"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
