plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = "${mod_version}-${minecraft_version}"
group = mod_group_id
base { archivesName = "${mod_id}-forge-${minecraft_version}" }

// This port shares its Java sources with the 1.21.1 NeoForge port. common/ holds
// the single tracked copy, carrying //#if <version> / //#else / //#endif markers
// on the handful of lines that genuinely differ; the prepareShared task below
// renders it for this version at the start of every build.
//
// Keeping one copy is deliberate: two hand-maintained copies had already drifted
// apart once (the 1.21.1 config screen was still calling the 1.20.1 registry
// API), and nothing in the build caught it.
def sharedGeneratedDir = layout.buildDirectory.dir('generated/shared')

sourceSets {
    main {
        java {
            srcDir sharedGeneratedDir.map { it.dir('java') }
        }
        resources {
            srcDir sharedGeneratedDir.map { it.dir('resources') }
        }
    }
}

// Renders common/src/main for this Minecraft version. PrepareShared.java is plain
// Java with no dependencies on Minecraft or on Gradle, so a single javac call
// compiles it and a single java call runs it.
//
// Note on paths: this project's rootDir is versions/v1_20_1, so the repository
// root is two levels up. `rootProject.file(...)` would NOT work here - it
// resolves against this project's directory, not against the repository root,
// and produced a task that looked for versions/common/tools/PrepareShared.java.
def repoRoot = project.rootDir.parentFile.parentFile
def sharedOutput = sharedGeneratedDir

tasks.register('prepareShared') {
    group = 'matesignal'
    description = 'Renders the shared sources in common/ for Minecraft 1.20.1.'

    def renderer = new File(repoRoot, 'common/tools/PrepareShared.java')
    def sharedSrc = new File(repoRoot, 'common/src/main')
    def rendererClasses = layout.buildDirectory.dir('renderer-classes')

    inputs.file(renderer)
    inputs.dir(sharedSrc)
    outputs.dir(sharedOutput)

    doLast {
        def launch = project.javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }.get()
        def javac = launch.metadata.installationPath.file('bin/javac').asFile.absolutePath
        def java = launch.metadata.installationPath.file('bin/java').asFile.absolutePath

        def classesDir = rendererClasses.get().asFile
        delete(classesDir)
        classesDir.mkdirs()
        exec { commandLine javac, '-encoding', 'UTF-8', '-d', classesDir, renderer.absolutePath }

        def target = sharedOutput.get().asFile
        delete(target)
        target.mkdirs()
        exec {
            commandLine java, '-cp', classesDir.absolutePath,
                    'PrepareShared', '1.20.1', sharedSrc.absolutePath, target.absolutePath
        }

        // Fail loudly here rather than with a confusing "package me.shiny does not
        // exist" later, if the renderer ever stops producing what the build expects.
        ['java/me/shiny/matesignal/MateSignal.java', 'resources/LICENSE.md'].each { rel ->
            if (!new File(target, rel).isFile()) {
                throw new GradleException("prepareShared did not produce ${rel}")
            }
        }
    }
}

tasks.named('compileJava') { dependsOn 'prepareShared' }
tasks.named('processResources') { dependsOn 'prepareShared' }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
    // ForgeGradle resolves the Minecraft library set through *project*
    // repositories, so Mojang's library host must be declared explicitly.
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}
